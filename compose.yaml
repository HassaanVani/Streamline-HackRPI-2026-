services:
  app:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - '8000'
    volumes:
      - weather-cache:/app/.cache
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
  web:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_ADDRESS: '${SITE_ADDRESS:-:80}'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
volumes:
  weather-cache:
  caddy-data:
  caddy-config:
