[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.16.0"
  # Use the same-origin proxy below rather than browser requests to an HTTP IP.
  VITE_API_BASE_URL = ""

# Keep API failures out of the SPA fallback. The backend returns jobs promptly;
# longer route calculations are polled with separate requests.
[[redirects]]
  from = "/api/*"
  to = "http://66.135.1.179/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
